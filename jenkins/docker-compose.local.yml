
name: prakati-jenkins-local

services:
  jenkins:
    build:
      context: ..
      dockerfile: jenkins/Dockerfile

    container_name: prakati-jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      JAVA_OPTS: "-Xmx512m -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_URL: http://localhost:8080/
      REPO_URL: ${REPO_URL:?Set REPO_URL in jenkins/.env}
      REPO_BRANCH: main
      GITHUB_USER: ${GITHUB_USER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#voice-ai-notifications}

    group_add:
      - "0"

    volumes:
      - jenkins_home_local:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home_local:
